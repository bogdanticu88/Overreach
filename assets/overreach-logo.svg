<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 110" width="470" height="110" role="img" aria-label="Overreach">
  <title>Overreach</title>
  <!-- Mark: a chain of calls, the last one breaching a boundary -->
  <g fill="none" stroke-width="3">
    <!-- connectors -->
    <path d="M22 55 H46" stroke="#5b6cf0" stroke-linecap="round"/>
    <path d="M46 55 H90" stroke="#e5484d" stroke-linecap="round"/>
    <!-- arrowhead on the breaching link -->
    <path d="M82 48 L92 55 L82 62" stroke="#e5484d" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- boundary the last call crosses -->
  <line x1="66" y1="22" x2="66" y2="88" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
  <!-- nodes -->
  <circle cx="22" cy="55" r="7.5" fill="none" stroke="#5b6cf0" stroke-width="3"/>
  <circle cx="46" cy="55" r="7.5" fill="none" stroke="#5b6cf0" stroke-width="3"/>
  <circle cx="94" cy="55" r="8.5" fill="#e5484d"/>
  <!-- Wordmark: "over" holds the line, "reach" crosses it -->
  <text x="126" y="72" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#5b6cf0">over</tspan><tspan fill="#e5484d">reach</tspan>
  </text>
</svg>
