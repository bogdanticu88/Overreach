[project]
name = "apd"
version = "0.0.1"
description = "Agent Attack Path Discovery: finds chains of legitimate API operations that reach a harmful outcome."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "networkx>=3.0"]

[project.optional-dependencies]
# The reference API and the validation harness need a web framework; the core
# analysis does not, so these stay optional.
demo = ["fastapi>=0.110", "httpx>=0.27"]
dev = ["pytest", "mypy", "types-PyYAML", "fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
apd = "apd.cli:main"

[tool.mypy]
strict = true
python_version = "3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
