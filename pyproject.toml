[project]
name = "overreach-scan"
version = "0.0.1"
description = "Overreach: find chains of legitimate API operations an AI agent can be led into, that combine into a harmful outcome."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Mihai-Bogdan Ticu" }]
keywords = ["security", "ai-agents", "api-security", "openapi", "mcp", "appsec"]
dependencies = ["PyYAML>=6.0", "networkx>=3.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/bogdanticu88/OverReach"
Repository = "https://github.com/bogdanticu88/OverReach"
Issues = "https://github.com/bogdanticu88/OverReach/issues"

[project.optional-dependencies]
demo = ["fastapi>=0.110", "httpx>=0.27"]
dev = ["pytest", "mypy", "types-PyYAML", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
overreach = "overreach.cli:main"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"overreach.reference_api" = ["*.yaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
