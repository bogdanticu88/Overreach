# Boundaries for the reference API: what the agent may do, what is untrusted,
# and which path parameter identifies a tenant. Supplying this turns generic
# "any tool reachable" findings into scoped, credible chains.

agent:
  acts_as: support-agent
  tenant: acme
  # The agent is meant only to read issues and manage webhooks. It should NOT
  # be able to change the user's email. Note that this list still permits the
  # exfiltration chain, which is the point: the scope looks reasonable yet a
  # chain still gets through.
  allowed_ops:
    - "GET /repos/{owner}/{repo}/issues/{issue_number}/comments"
    - "POST /repos/{owner}/{repo}/issues/{issue_number}/comments"
    - "GET /repos/{owner}/{repo}/contents/{path}"
    - "POST /repos/{owner}/{repo}/hooks"
    - "POST /repos/{owner}/{repo}/push"

untrusted_fields:
  - "Comment.body"

tenants:
  key: path.owner
