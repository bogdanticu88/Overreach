name: ci

on:
  pull_request:
  push:          # run on every branch push (release-candidate branches included)

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests demo docs
      - name: Type-check (mypy, strict)
        run: python -m mypy src/overreach
      - name: Tests
        run: python -m pytest -q
      - name: Security lint (bandit)
        run: python -m bandit -r src/overreach
      - name: Dependency audit (runtime deps)
        # Audit what users install (the single runtime dependency). The
        # demo/dev extras are developer-only and not gated here. No findings
        # are suppressed; if this step fails, a dependency needs bumping.
        run: |
          printf 'PyYAML>=6.0\n' > "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/runtime-requirements.txt"
