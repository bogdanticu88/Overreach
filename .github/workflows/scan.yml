name: overreach-scan

# Scans an OpenAPI spec for agent attack chains and uploads the findings to
# GitHub code scanning. By default it REPORTS findings without failing the
# build (the bundled example is deliberately vulnerable). To gate your own
# build, add `--fail-on error` to the scan step below.
# Point SPEC (and optionally BOUNDARIES) at your API's files.

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Replace these with your own API's spec and boundaries files.
  SPEC: examples/reference_openapi.json
  BOUNDARIES: examples/reference_boundaries.yaml

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the scanner
        # The bundled example is deliberately vulnerable, so this run only
        # reports. In your own repo add `--fail-on error` to gate the build.
        run: |
          overreach scan "$SPEC" --boundaries "$BOUNDARIES" --sarif overreach.sarif
      - name: Save SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: overreach-sarif
          path: overreach.sarif
      - name: Upload to code scanning (optional)
        # Needs GitHub Advanced Security on private repos; free on public ones.
        # continue-on-error keeps the build green where it is not available.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311  # v3
        with:
          sarif_file: overreach.sarif
